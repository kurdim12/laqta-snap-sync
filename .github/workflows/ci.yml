name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Format check
        run: bun run format:check
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
  # RLS + e2e need a live Supabase + a running server, so they are not part of
  # the per-push job. Run scripts/rls-check.mjs against a local/branch instance
  # (see PHASE0_NOTES.md) and the Playwright smoke suite (e2e/) on demand.
